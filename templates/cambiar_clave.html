<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actualizar Contraseña · Distribuidora HB</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #EEF2FF 0%, #ECFDF5 100%); padding: 20px;
    }
    .card {
      background: #FFF; border-radius: 24px; padding: 36px; width: 100%; max-width: 420px;
      box-shadow: 0 20px 50px rgba(99, 102, 241, 0.08);
    }
    h1 { font-size: 20px; font-weight: 700; color: #1E293B; margin-bottom: 6px; }
    p { font-size: 13px; color: #64748B; margin-bottom: 22px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 5px; }
    input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1.5px solid #E2E8F0; font-size: 14px; }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 12px; margin-top: 8px;
      background: #4F46E5; color: #FFF; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .error { background: #FEF2F2; color: #DC2626; padding: 10px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Seguridad de la Cuenta</h1>
    <p>Hola <strong>{{ user.nombre }}</strong>, por seguridad debes establecer una contraseña personal nueva antes de continuar.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <div class="field"><label>Nueva Contraseña (mínimo 8 caracteres)</label><input type="password" name="nueva" required minlength="8" /></div>
      <div class="field"><label>Confirmar Nueva Contraseña</label><input type="password" name="confirmar" required minlength="8" /></div>
      <button type="submit">Guardar y Entrar al Dashboard</button>
    </form>
  </div>
</body>
</html>
