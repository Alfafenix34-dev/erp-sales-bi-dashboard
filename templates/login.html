<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso · Distribuidora HB</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #FDF2F8 0%, #EEF2FF 50%, #ECFDF5 100%);
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.95); border-radius: 24px;
      padding: 40px 36px; width: 100%; max-width: 410px;
      box-shadow: 0 20px 50px rgba(99, 102, 241, 0.08);
      animation: floatUp 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes floatUp {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .logo-box { text-align: center; margin-bottom: 24px; }
    .logo-img {
      height: 76px; width: auto; max-width: 220px;
      object-fit: contain; display: block; margin: 0 auto;
    }
    .logo-fallback {
      width: 68px; height: 68px; border-radius: 20px; margin: 0 auto;
      background: linear-gradient(135deg, #A5B4FC, #6EE7B7); color: #1E1B4B;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700;
    }
    h1 { font-size: 21px; font-weight: 700; color: #1E293B; text-align: center; margin-top: 12px; }
    p.sub { font-size: 13px; color: #64748B; text-align: center; margin-top: 4px; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #E2E8F0;
      font-size: 14px; background: #F8FAFC; outline: none; transition: all 0.2s;
    }
    input:focus { border-color: #818CF8; background: #FFF; box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.14); }
    button {
      width: 100%; padding: 13px; border: none; border-radius: 12px; margin-top: 8px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6); color: #FFF;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(99, 102, 241, 0.25); }
    .error {
      background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA;
      padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-box">
      {% if logo_existe %}
        <img class="logo-img" src="/static/logo_hb.png" alt="Distribuidora HB" />
      {% else %}
        <div class="logo-fallback">HB</div>
      {% endif %}
      <h1>Distribuidora HB</h1>
      <p class="sub">Plataforma Inteligente de Gestión Comercial</p>
    </div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <div class="field">
        <label>Usuario</label>
        <input type="text" name="username" placeholder="Ingresa tu usuario" required autofocus />
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit">Ingresar al Panel</button>
    </form>
  </div>
</body>
</html>
